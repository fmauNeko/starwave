packages:
  - apps/*
  - packages/*

allowBuilds:
  '@discordjs/opus': true
  '@nestjs/core': true
  '@suites/di.nestjs': true
  '@suites/doubles.vitest': true
  '@swc/core': true
  canvas: true
  esbuild: true
  # necord's only build script is the @nuxt/opencollective donation banner,
  # which crashes libuv on Windows (exit 0xc0000409). It is purely cosmetic.
  necord: false
  unrs-resolver: true
